name: Build AirCard IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Export IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version

      - name: Install Toolchain and Dependencies
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios

      - name: Build Rust Core
        run: |
          if [ -d "rust-core" ]; then
            cd rust-core
            cargo build --release --target aarch64-apple-ios
            cd ..
          fi

      - name: Make Scripts Executable
        run: |
          chmod +x ./build-ipa.sh || true
          chmod +x ./build-ios.sh || true

      - name: Build IPA
        run: |
          ./build-ipa.sh

      - name: Locate IPA Artifact
        id: find_ipa
        run: |
          IPA_PATH=$(find . -name "*.ipa" -type f | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Error: No .ipa file found after build."
            exit 1
          fi
          echo "Found IPA at: $IPA_PATH"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-unsigned
          path: ${{ steps.find_ipa.outputs.ipa_path }}
          retention-days: 14
